
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account Access</title>
<style>
*{box-sizing:border-box}
  html{
  background:#090a10;
  }
body{
  visibility:hidden;
  margin:0;
  min-height:100vh;
  min-height:100svh;
  padding:0;
  display:flex;
  align-items:stretch;
  justify-content:stretch;
    background-color:#090a10;
    background:#090a10;
  color:#f5f2eb;
  font-family:Arial,sans-serif;
}

.card{
  width:100%;
  max-width:none;
  min-height:100vh;
  min-height:100svh;
  margin:0;
  padding:clamp(28px,7vh,65px) 25px;
    background-color:#090a10;
  background-image:url('./cross.jpg');
background-size:68% auto;
background-position:left top;
background-repeat:no-repeat;
background-blend-mode:screen;
  position:relative;
  isolation:isolate;
  z-index:1;
  border:0;
  border-radius:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.card > *{
  position:relative;
  z-index:1;
  width:100%;
  max-width:480px;
  margin-left:auto;
  margin-right:auto;
}
.tabs{display:flex;background:#222432;padding:5px;border-radius:12px;margin-bottom:28px}
.tabs button{
  flex:1;padding:13px;border:0;border-radius:9px;
  background:transparent;color:#b8b8c3;font-weight:bold
}
.tabs button.active{background:#c9a65e;color:#111}
h1{font-size:27px;margin:0 0 12px}
.intro{display:none;color:#b8b8c3;font-size:14px;line-height:1.6;margin-bottom:24px}
label{display:block;margin:17px 0 8px;font-size:14px;color:#e4e1da}
input{
  width:100%;padding:14px;background:#202330;
  border:1px solid #383b49;border-radius:10px;
  color:white;font-size:15px;outline:none
}
input:focus{border-color:#c9a65e}
.password{display:flex;gap:8px}
.password input{flex:1;min-width:0}
.show{
  background:#303342;color:#eee;border:1px solid #44485a;
  border-radius:9px;padding:0 12px
}
.forgot{text-align:right;margin-top:13px}
a{color:#e3c477;text-decoration:none;font-size:13px}
.submit{
  width:100%;padding:15px;margin-top:22px;
  border:0;border-radius:10px;background:#c9a65e;
  color:#111;font-size:15px;font-weight:bold
}

#googleSignIn{
  width:100%;
  display:flex;
align-items:center;
justify-content:center;
gap:10px;
  padding:13px;
  margin:0 0 20px;
  border:1px solid #383b49;
  border-radius:10px;
  background:#202330;
  color:#f5f2eb;
  font-size:14px;
  font-weight:bold;
}
#googleSignIn:disabled{opacity:.6}
  
.switch{text-align:center;color:#b8b8c3;font-size:13px;margin-top:22px}
.message{
  display:none;margin-top:16px;padding:12px;
  border-radius:9px;background:#252a35;color:#e7d5a7;
  font-size:13px;line-height:1.5
}
.hidden{display:none}
button{cursor:pointer}
  .divider{
  display:flex;
  align-items:center;
  gap:12px;
  margin:0 0 18px;
  color:#b8b8c3;
  font-size:11px;
}
.divider::before,.divider::after{
  content:"";
  flex:1;
  height:1px;
  background:#383b49;
}
  .tabs,
#authForm,
#switchText{
  display:none;
}

#welcomeChoices{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:16px;
  margin-top:4px;
}

#emailLoginChoice,
#createAccountChoice{
  width:100%;
  border:0;
  background:transparent;
  color:#f5f2eb;
  padding:10px;
  font-size:14px;
  font-weight:600;
}

#emailLoginChoice{
  color:#d6b779;
}

.legalText{
  margin:8px 0 0;
  color:#b8b8c3;
  font-size:11px;
  text-align:center;
  line-height:1.6;
}
  #backToWelcome{
  display:none;
  width:auto;
  align-self:flex-start;
  margin:0 auto 16px 0;
  padding:0;
  border:0;
  background:transparent;
  color:#d6b779;
  font-size:22px;
  text-align:left;
}


#welcomeActions{
  position:absolute;
  left:25px;
  right:25px;
  bottom:20px;
  width:auto;
  max-width:480px;
  margin:0 auto;
}

.card::before{
  content:"";
  position:absolute;
  top:0;
  right:0;
  width:74%;
  height:min(44vh,340px);
    background-image:
    linear-gradient(90deg,#090a10 0%,rgba(9,10,16,.35) 25%,transparent 75%),
    linear-gradient(0deg,#090a10 0%,transparent 55%),
    linear-gradient(rgba(9,10,16,.12),rgba(9,10,16,.12)),
    url('./woman-photo.jpg');
  background-size:100% 100%,100% 100%,100% 100%,cover;
  background-position:center,center,center,left top;
  background-repeat:no-repeat;
  z-index:0;
  pointer-events:none;
  } 
    
.card::after{
  content:"";
  display:block;
  flex:0 0 205px;
    }
</style>

<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-HMBV5J56JD"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-HMBV5J56JD');
</script>
  
</head>
<body>

<div class="card">
  <div class="tabs">
    <button id="signupTab" class="active" type="button">Sign Up</button>
    <button id="loginTab" type="button">Login</button>
  </div>

  <h1 id="heading">Create your account</h1>
  <p class="intro" id="intro">
    Please use your real name when creating your account so we can identify you and connect you with the right people in our community.
  </p>

    <div id="welcomeActions">
    <button id="googleSignIn" type="button">
      <svg width="19" height="19" viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#4285F4" d="M43.6 24.5c0-1.4-.1-2.8-.4-4.1H24v7.8h11a9.4 9.4 0 0 1-4.1 6.2v5.1h6.7c3.9-3.6 6-8.8 6-15z"/>
        <path fill="#34A853" d="M24 44c5.5 0 10.1-1.8 13.5-4.9l-6.7-5.1c-1.8 1.2-4.1 2-6.8 2-5.2 0-9.6-3.5-11.2-8.2H5.9v5.2A20 20 0 0 0 24 44z"/>
        <path fill="#FBBC05" d="M12.8 27.8a12 12 0 0 1 0-7.6V15H5.9a20 20 0 0 0 0 18z"/>
        <path fill="#EA4335" d="M24 12.1c3 0 5.7 1 7.8 3.1l5.8-5.8C34.1 6.1 29.5 4 24 4A20 20 0 0 0 5.9 15l6.9 5.2c1.6-4.7 6-8.1 11.2-8.1z"/>
      </svg>
      Continue with Google
    </button>

    <div class="divider"><span>Or</span></div>

    <div id="welcomeChoices">
      <button id="emailLoginChoice" type="button">Sign in with email</button>
      <button id="createAccountChoice" type="button">Create account</button>
      <p class="legalText">By continuing, you agree to our Terms and Privacy Policy.</p>
    </div>
    </div>
  <button id="backToWelcome" type="button">←</button>
  <form id="authForm">
    <div id="nameField">
      <label for="fullName">Full name</label>
      <input id="fullName" type="text" placeholder="Enter your real full name" autocomplete="name">
    </div>

    <label for="email">Email address</label>
    <input id="email" type="email" placeholder="Enter your email address" required autocomplete="email">

    <label for="password">Password</label>
    <div class="password">
      <input id="password" type="password" placeholder="Enter your password" required autocomplete="current-password">
      <button class="show" id="showPassword" type="button">Show</button>
    </div>

    <div id="confirmField">
      <label for="confirmPassword">Confirm password</label>
      <input id="confirmPassword" type="password" placeholder="Confirm your password" autocomplete="new-password">
    </div>

    <div id="forgotArea" class="forgot hidden">
      <a href="#" id="forgotLink">Forgot password?</a>
    </div>

    <button class="submit" id="submitButton" type="submit">Create Account</button>
  </form>

  <div class="switch" id="switchText">
    Already have an account? <a href="#" id="switchLink">Login</a>
  </div>

  <div class="message" id="message"></div>

<button id="resendVerification" class="submit hidden" type="button">
  Resend Verification Email
</button>

</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
 getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
 sendEmailVerification, sendPasswordResetEmail, updateProfile,
 setPersistence, browserLocalPersistence, onAuthStateChanged, signOut, reload,
 GoogleAuthProvider, signInWithPopup
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

  import {
  getFirestore,
  doc,
  setDoc
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA3rI1PVBHOGN24VLqgAKBiI50BkYlXW_o",
  authDomain: "logic-teens.firebaseapp.com",
  projectId: "logic-teens",
  storageBucket: "logic-teens.firebasestorage.app",
  messagingSenderId: "542931056170",
  appId: "1:542931056170:web:7c9f7951bd5150618f3553"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
  const googleProvider = new GoogleAuthProvider();
googleProvider.setCustomParameters({prompt:"select_account"});
const db = getFirestore(app);

await setPersistence(auth, browserLocalPersistence);

const $ = id => document.getElementById(id);
let mode = new URLSearchParams(window.location.search).get("mode") === "login"
  ? "login"
  : "signup";
function showMessage(text) {
  $("message").textContent = text;
  $("message").style.display = "block";
}

function clearMessage() {
  $("message").style.display = "none";
}

function setMode(newMode) {
  mode = newMode;
  clearMessage();

  const signup = mode === "signup";
  $("signupTab").classList.toggle("active", signup);
  $("loginTab").classList.toggle("active", !signup);
  $("nameField").classList.toggle("hidden", !signup);
  $("confirmField").classList.toggle("hidden", !signup);
  $("forgotArea").classList.toggle("hidden", signup);

  $("heading").textContent = signup ? "Create your account" : "Welcome back";

  $("intro").textContent = signup
    ? "Please use your real name when creating your account so we can identify you and connect you with the right people in our community."
    : "Enter your details below to access your account.";

  $("submitButton").textContent = signup ? "Create Account" : "Login";
  $("switchText").innerHTML = signup
    ? 'Already have an account? <a href="#" id="switchLink">Login</a>'
    : 'Don’t have an account? <a href="#" id="switchLink">Sign Up</a>';

  $("password").value = "";
  $("confirmPassword").value = "";
  $("password").type = "password";
  $("showPassword").textContent = "Show";

  $("switchLink").addEventListener("click", e => {
    e.preventDefault();
    setMode(signup ? "login" : "signup");
  });
}
  setMode(mode);

  document.body.style.visibility = "visible";

  $("heading").textContent = "Stay Rooted in the Love of God in Christ";

function openEmailForm(selectedMode) {
  setMode(selectedMode);
  $("welcomeChoices").style.display = "none";
  $("googleSignIn").style.display = "none";
  document.querySelector(".divider").style.display = "none";
  $("authForm").style.display = "block";
  $("switchText").style.display = "block";
  $("backToWelcome").style.display = "block";
  $("intro").style.display = "block";
}

  $("backToWelcome").addEventListener("click", () => {
  clearMessage();
  $("authForm").style.display = "none";
  $("switchText").style.display = "none";
  $("backToWelcome").style.display = "none";
    $("intro").style.display = "none";
  $("welcomeChoices").style.display = "flex";
  $("googleSignIn").style.display = "flex";
  document.querySelector(".divider").style.display = "flex";
  $("heading").textContent = "Stay Rooted in the Love of God in Christ";
});
  
$("emailLoginChoice").addEventListener("click", () => {
  openEmailForm("login");
});

$("createAccountChoice").addEventListener("click", () => {
  openEmailForm("signup");
});

$("signupTab").addEventListener("click", () => setMode("signup"));
$("loginTab").addEventListener("click", () => setMode("login"));

$("showPassword").addEventListener("click", () => {
  const show = $("password").type === "password";

  $("password").type = show ? "text" : "password";
  $("confirmPassword").type = show ? "text" : "password";

  $("showPassword").textContent = show ? "Hide" : "Show";
});

$("googleSignIn").addEventListener("click", async () => {
  const button = $("googleSignIn");
  button.disabled = true;

  try {
    const result = await signInWithPopup(auth, googleProvider);
    const user = result.user;

    if (typeof gtag === "function") {
  gtag("event", "login", {method: "Google"});
    }

    const fullName = user.displayName || user.email.split("@")[0];
    const joinedAt = user.metadata.creationTime || new Date().toISOString();

    const profile = {
      fullName,
      email: user.email || "",
      username: "",
      photoURL: user.photoURL || "",
      about: "",
      joinedAt
    };

    await setDoc(doc(db, "users", user.uid), profile, { merge: true });
    await setDoc(doc(db, "publicProfiles", user.uid), profile, { merge: true });

    window.location.href = "index.html";
  } catch (error) {
    showMessage(error.message || "Google sign-in failed. Please try again.");
  } finally {
    button.disabled = false;
  }
});
  
$("authForm").addEventListener("submit", async e => {
  e.preventDefault();
  clearMessage();
  $("resendVerification").classList.add("hidden");

  const email = $("email").value.trim();
  const password = $("password").value;
  const button = $("submitButton");

  button.disabled = true;
  button.textContent = "Please wait...";

  try {
    if (mode === "signup") {
      const fullName = $("fullName").value.trim();
      const confirmPassword = $("confirmPassword").value;

      if (!fullName) throw Error("Please enter your real full name.");
      if (password.length < 6) throw Error("Your password must be at least 6 characters.");
      if (password !== confirmPassword) throw Error("Your passwords do not match.");

      const result = await createUserWithEmailAndPassword(auth, email, password);

await updateProfile(result.user, { displayName: fullName });

// Save the original account creation date for every new member.
const joinedAt =
  result.user.metadata.creationTime || new Date().toISOString();

const newMemberProfile = {
  fullName: fullName,
  email: result.user.email || email,
  username: "",
  photoURL: "",
  about: "",
  joinedAt: joinedAt
};

// Save the account profile.
await setDoc(doc(db, "users", result.user.uid), {
  ...newMemberProfile
});

// Save the public directory profile.
await setDoc(doc(db, "publicProfiles", result.user.uid), {
  ...newMemberProfile,
  isAdmin: false
});
      if (typeof gtag === "function") {
  gtag("event", "sign_up", {method: "Email"});
  }

      try {
        await sendEmailVerification(result.user);
        showMessage("Your account has been created! Check your email and tap Verify Email. Then return here to log in.");
      } catch (emailError) {
        showMessage("Your account was created, but we couldn't send the verification email. Check your email address and use Resend Verification Email.");
        $("resendVerification").classList.remove("hidden");
      }

      await signOut(auth);

    } else {
      const result = await signInWithEmailAndPassword(auth, email, password);

      await reload(result.user);

      if (!result.user.emailVerified) {
        await signOut(auth);
        showMessage("Your email is not verified yet. Check your inbox or request another verification email below.");
        $("resendVerification").classList.remove("hidden");
        return;
      }

if (typeof gtag === "function") {
  gtag("event", "login", {method: "Email"});
}
      
      window.location.href = "index.html";
    }

  } catch (error) {
    const messages = {
      "auth/email-already-in-use": "This email already has an account. Log in or resend its verification email.",
      "auth/invalid-email": "Please enter a valid email address.",
      "auth/weak-password": "Please choose a stronger password.",
      "auth/invalid-credential": "Incorrect email or password.",
      "auth/network-request-failed": "Network error. Please check your internet connection.",
      "auth/too-many-requests": "Too many attempts. Please try again later."
    };

    showMessage(messages[error.code] || error.message || "Something went wrong. Please try again.");
  } finally {
    button.disabled = false;
    button.textContent = mode === "signup" ? "Create Account" : "Login";
  }
});

  $("resendVerification").addEventListener("click", async () => {
  clearMessage();

  const email = $("email").value.trim();
  const password = $("password").value;

  if (!email || !password) {
    showMessage("Enter your email and password first.");
    return;
  }

  try {
    const result = await signInWithEmailAndPassword(auth, email, password);

    await reload(result.user);

    if (result.user.emailVerified) {
      await signOut(auth);
      showMessage("Your email is already verified! You can now log in.");
      $("resendVerification").classList.add("hidden");
      return;
    }

    await sendEmailVerification(result.user);
    await signOut(auth);

    showMessage("A new verification email has been sent. Check your inbox and Spam folder.");
  } catch (error) {
    showMessage("We couldn't resend the email. Check your email and password, then try again.");
  }
});
  
$("forgotLink").addEventListener("click", async e => {
  e.preventDefault();
  clearMessage();

  const email = $("email").value.trim();

  if (!email) {
    showMessage("Enter your registered email address first.");
    $("email").focus();
    return;
  }

  try {
    await sendPasswordResetEmail(auth, email);
    showMessage("If an account exists for this address, a password reset email has been sent. Check your inbox.");
  } catch (error) {
    if (error.code === "auth/invalid-email") {
      showMessage("Please enter a valid email address.");
    } else {
      showMessage("We couldn't send the reset email. Please try again.");
    }
  }
});

</script>

</body>
  </html>
